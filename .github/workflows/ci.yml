name: CI / Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Test and Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test & Build Backend (NestJS)
        run: |
          cd nest
          npm ci || npm install
          npm test
          npm run build

      - name: Build Frontend (Nuxt 3)
        run: |
          cd nuxt
          npm ci || npm install
          npm run build
